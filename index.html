</style></head><body><header><h1>Marine Engineering Maths Trainer</h1><p>Learn each topic step by step, practise with fresh questions, then test yourself. You've got this!</p></header>
<main id="app"></main><script>
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}
const r = (x, dp) => {
  const f = Math.pow(10, dp);
  return Math.round(x * f) / f;
};
const G = {
  transpose: () => {
    const t = ri(0, 2);
    if (t === 0) {
      const V = ri(12, 440), R = pick([2, 4, 5, 8, 10, 20, 25]);
      return { q: `Using V = I \xD7 R, a heater circuit has V = ${V} V and R = ${R} \u03A9. Transpose for I and find the current.`, ans: r(V / R, 2), unit: "A", hint: "Divide both sides by R to get I on its own.", sol: `Start: V = I \xD7 R. Divide both sides by R: I = V \xF7 R. Substitute: I = ${V} \xF7 ${R} = ${r(V / R, 2)} A` };
    }
    if (t === 1) {
      const F = ri(2, 40) * 100, A = pick([0.02, 0.05, 0.1, 0.25, 0.5]);
      return { q: `Using P = F \xF7 A, a hydraulic ram needs pressure P = ${F} Pa acting on A = ${A} m\xB2. Transpose for F and find the force.`, ans: r(F * A, 2), unit: "N", hint: "Multiply both sides by A.", sol: `Start: P = F \xF7 A. Multiply both sides by A: F = P \xD7 A. Substitute: F = ${F} \xD7 ${A} = ${r(F * A, 2)} N` };
    }
    const u = ri(0, 10), a = ri(1, 5), t2 = ri(2, 12), v = u + a * t2;
    return { q: `Using v = u + a\xB7t, a pump shaft speeds up from u = ${u} m/s to v = ${v} m/s with a = ${a} m/s\xB2. Transpose for t and find the time.`, ans: t2, unit: "s", hint: "Subtract u from both sides, then divide by a.", sol: `Start: v = u + a\xB7t. Subtract u from both sides: v \u2212 u = a\xB7t. Divide both sides by a: t = (v \u2212 u) \xF7 a. Substitute: t = (${v} \u2212 ${u}) \xF7 ${a} = ${v - u} \xF7 ${a} = ${t2} s` };
  },
  fdp: () => {
    const t = ri(0, 2);
    if (t === 0) {
      const cap = ri(20, 90) * 100, p = pick([15, 20, 25, 35, 40, 60, 65, 75, 85]);
      return { q: `A fuel tank holds ${cap} litres when full. It is ${p}% full. How many litres are in it?`, ans: r(cap * p / 100, 2), unit: "L", hint: "Turn the percentage into a decimal (\xF7100) and multiply.", sol: `Convert: ${p}% = ${p} \xF7 100 = ${p / 100}. Multiply: ${cap} \xD7 ${p / 100} = ${r(cap * p / 100, 2)} L` };
    }
    if (t === 1) {
      const d = pick([2, 4, 5, 8]), n = ri(1, d - 1);
      return { q: `A gauge needle sits at ${n}/${d} of full scale. Write this as a percentage.`, ans: r(n / d * 100, 2), unit: "%", hint: "Divide top by bottom, then \xD7 100.", sol: `Divide: ${n} \xF7 ${d} = ${n / d}. Multiply by 100: ${n / d} \xD7 100 = ${r(n / d * 100, 2)}%` };
    }
    const old = ri(20, 80) * 10, inc = pick([5, 10, 12, 15, 20]);
    return { q: `A generator's output of ${old} kW rises by ${inc}%. What is the new output?`, ans: r(old * (1 + inc / 100), 2), unit: "kW", hint: `Multiply by 1 + ${inc}/100.`, sol: `Multiplier: 1 + ${inc} \xF7 100 = ${1 + inc / 100}. Multiply: ${old} \xD7 ${1 + inc / 100} = ${r(old * (1 + inc / 100), 2)} kW` };
  },
  ratio: () => {
    const t = ri(0, 1);
    if (t === 0) {
      const a = ri(1, 4), b = ri(a + 1, 9), tot = (a + b) * ri(2, 20);
      return { q: `Glycol coolant is mixed water : glycol = ${b} : ${a}. How many litres of glycol in ${tot} L of mix?`, ans: tot * a / (a + b), unit: "L", hint: `Total parts = ${a + b}. Find one part first.`, sol: `Total parts: ${b} + ${a} = ${a + b}. One part: ${tot} \xF7 ${a + b} = ${tot / (a + b)} L. Glycol: ${a} \xD7 ${tot / (a + b)} = ${tot * a / (a + b)} L` };
    }
    const T = ri(10, 60), D = pick([2, 3, 4]);
    return { q: `A drive gear has ${T} teeth and the driven gear has ${T * D} teeth. If the driver turns at ${D * 300} rev/min, what speed is the driven gear?`, ans: 300, unit: "rev/min", hint: "Speed ratio is the inverse of the teeth ratio: N2 = N1 \xD7 T1 \xF7 T2.", sol: `Formula: N2 = N1 \xD7 T1 \xF7 T2. Substitute: N2 = ${D * 300} \xD7 ${T} \xF7 ${T * D}. Work out: ${D * 300 * T} \xF7 ${T * D} = 300 rev/min` };
  },
  units: () => {
    const t = ri(0, 3);
    if (t === 0) {
      const kw = ri(5, 900) / 10;
      return { q: `Convert ${kw} kW to watts.`, ans: r(kw * 1e3, 2), unit: "W", hint: "kilo = \xD7 1000.", sol: `Kilo means 1000, so multiply by 1000. ${kw} \xD7 1000 = ${r(kw * 1e3, 2)} W` };
    }
    if (t === 1) {
      const mm = ri(50, 2500);
      return { q: `Convert ${mm} mm to metres.`, ans: mm / 1e3, unit: "m", hint: "1 m = 1000 mm, so \xF7 1000.", sol: `There are 1000 mm in a metre, so divide by 1000. ${mm} \xF7 1000 = ${mm / 1e3} m` };
    }
    if (t === 2) {
      const bar = ri(2, 40);
      return { q: `A lube oil system runs at ${bar} bar. Convert to kPa (1 bar = 100 kPa).`, ans: bar * 100, unit: "kPa", hint: "Multiply by 100.", sol: `1 bar = 100 kPa, so multiply by 100. ${bar} \xD7 100 = ${bar * 100} kPa` };
    }
    const m3 = ri(2, 150) / 10;
    return { q: `Convert ${m3} m\xB3 to litres.`, ans: r(m3 * 1e3, 2), unit: "L", hint: "1 m\xB3 = 1000 litres.", sol: `1 m\xB3 = 1000 L, so multiply by 1000. ${m3} \xD7 1000 = ${r(m3 * 1e3, 2)} L` };
  },
  stdform: () => {
    const t = ri(0, 1);
    if (t === 0) {
      const m = ri(11, 99) / 10, e = ri(3, 7);
      return { q: `Write ${m} \xD7 10^${e} as an ordinary number.`, ans: r(m * Math.pow(10, e), 0), unit: "", hint: `Move the decimal point ${e} places right.`, sol: `The power is +${e}, so the number is big. Move the decimal point ${e} places to the right, filling gaps with zeros. Answer: ${r(m * Math.pow(10, e), 0)}` };
    }
    const a = ri(2, 9), b = ri(2, 9), e1 = ri(2, 5), e2 = ri(-3, -1);
    const v = a * b * Math.pow(10, e1 + e2);
    return { q: `A current of ${a} \xD7 10^${e2} A flows through ${b} \xD7 10^${e1} \u03A9. Find V = I \xD7 R (as a normal number).`, ans: r(v, 4), unit: "V", hint: "Multiply the front numbers, add the powers.", sol: `Multiply the front numbers: ${a} \xD7 ${b} = ${a * b}. Add the powers: ${e2} + ${e1} = ${e1 + e2}. Combine: V = ${a * b} \xD7 10^${e1 + e2} = ${r(v, 4)} V` };
  },
  area: () => {
    const t = ri(0, 2);
    if (t === 0) {
      const l = ri(2, 8), w = ri(2, 6), h = ri(1, 4);
      return { q: `A rectangular double-bottom tank is ${l} m \xD7 ${w} m \xD7 ${h} m. What is its capacity in litres?`, ans: l * w * h * 1e3, unit: "L", hint: "Volume = l \xD7 w \xD7 h in m\xB3, then \xD7 1000 for litres.", sol: `Volume: ${l} \xD7 ${w} \xD7 ${h} = ${l * w * h} m\xB3. Convert: ${l * w * h} \xD7 1000 = ${l * w * h * 1e3} L` };
    }
    if (t === 1) {
      const d2 = ri(10, 40) / 10, h = ri(2, 6);
      const v = Math.PI * (d2 / 2) ** 2 * h;
      return { q: `A cylindrical fresh water tank has diameter ${d2} m and height ${h} m. Find its volume in m\xB3 (2 d.p.).`, ans: r(v, 2), unit: "m\xB3", hint: "V = \u03C0 r\xB2 h, and r = d \xF7 2.", sol: `Radius: r = ${d2} \xF7 2 = ${d2 / 2} m. Square it: ${d2 / 2}\xB2 = ${r((d2 / 2) ** 2, 4)}. Multiply: \u03C0 \xD7 ${r((d2 / 2) ** 2, 4)} \xD7 ${h} = ${r(v, 2)} m\xB3` };
    }
    const d = ri(50, 300);
    const a = Math.PI * (d / 2) ** 2;
    return { q: `Find the area of a pipe bore of diameter ${d} mm (to the nearest mm\xB2).`, ans: Math.round(a), unit: "mm\xB2", hint: "A = \u03C0 d\xB2 \xF7 4.", sol: `Square the diameter: ${d}\xB2 = ${d * d}. Multiply by \u03C0: ${r(Math.PI * d * d, 1)}. Divide by 4: ${Math.round(a)} mm\xB2`, tol: 2e-3 };
  },
  pressure: () => {
    const t = ri(0, 1);
    if (t === 0) {
      const F = ri(2, 50) * 1e3, A = pick([0.01, 0.02, 0.04, 0.05, 0.1]);
      return { q: `A force of ${F} N acts on a piston of area ${A} m\xB2. What pressure in kPa?`, ans: r(F / A / 1e3, 2), unit: "kPa", hint: "P = F \xF7 A gives Pa; \xF7 1000 for kPa.", sol: `Formula: P = F \xF7 A. Substitute: ${F} \xF7 ${A} = ${r(F / A, 2)} Pa. Convert: \xF7 1000 = ${r(F / A / 1e3, 2)} kPa` };
    }
    const h = ri(2, 15);
    return { q: `What is the pressure at the bottom of a seawater tank ${h} m deep? Use \u03C1 = 1025 kg/m\xB3, g = 9.81 m/s\xB2. Answer in kPa (1 d.p.).`, ans: r(1025 * 9.81 * h / 1e3, 1), unit: "kPa", hint: "P = \u03C1 g h, then \xF7 1000.", sol: `Formula: P = \u03C1 \xD7 g \xD7 h. Substitute: 1025 \xD7 9.81 \xD7 ${h} = ${r(1025 * 9.81 * h, 1)} Pa. Convert: \xF7 1000 = ${r(1025 * 9.81 * h / 1e3, 1)} kPa` };
  },
  ohm: () => {
    const t = ri(0, 2);
    if (t === 0) {
      const I2 = ri(2, 20), R2 = ri(2, 50);
      return { q: `A motor winding of ${R2} \u03A9 draws ${I2} A. What voltage is across it?`, ans: I2 * R2, unit: "V", hint: "V = I \xD7 R.", sol: `Formula: V = I \xD7 R. Substitute: V = ${I2} \xD7 ${R2} = ${I2 * R2} V` };
    }
    if (t === 1) {
      const V = pick([24, 110, 230, 440]), I2 = ri(2, 30);
      return { q: `A ${V} V supply feeds a load drawing ${I2} A. What power is used (in W)?`, ans: V * I2, unit: "W", hint: "P = V \xD7 I.", sol: `Formula: P = V \xD7 I. Substitute: P = ${V} \xD7 ${I2} = ${V * I2} W` };
    }
    const I = ri(2, 15), R = ri(2, 20);
    return { q: `A ${R} \u03A9 heater element carries ${I} A. What power does it dissipate?`, ans: I * I * R, unit: "W", hint: "P = I\xB2 \xD7 R.", sol: `Formula: P = I\xB2 \xD7 R. Square the current: ${I}\xB2 = ${I * I}. Multiply: ${I * I} \xD7 ${R} = ${I * I * R} W` };
  },
  trig: () => {
    const t = ri(0, 1), ang = pick([20, 25, 30, 35, 40, 45, 50, 60]), L2 = ri(2, 12);
    const rad = ang * Math.PI / 180;
    if (t === 0) return { q: `A ladder ${L2} m long leans at ${ang}\xB0 to the deck. How high up the bulkhead does it reach? (2 d.p.)`, ans: r(L2 * Math.sin(rad), 2), unit: "m", hint: "Height is opposite the angle, ladder is the hypotenuse: use sin.", sol: `Label: hypotenuse = ${L2} m, want the opposite. SOH: sin \u03B8 = O \xF7 H, so O = H \xD7 sin \u03B8. Substitute: ${L2} \xD7 sin ${ang}\xB0 = ${L2} \xD7 ${r(Math.sin(rad), 4)} = ${r(L2 * Math.sin(rad), 2)} m` };
    return { q: `A pipe run rises at ${ang}\xB0 over a horizontal distance of ${L2} m. How much does it rise? (2 d.p.)`, ans: r(L2 * Math.tan(rad), 2), unit: "m", hint: "Opposite and adjacent: use tan.", sol: `Label: adjacent = ${L2} m, want the opposite. TOA: tan \u03B8 = O \xF7 A, so O = A \xD7 tan \u03B8. Substitute: ${L2} \xD7 tan ${ang}\xB0 = ${L2} \xD7 ${r(Math.tan(rad), 4)} = ${r(L2 * Math.tan(rad), 2)} m` };
  },
  pyth: () => {
    const tr = pick([[3, 4, 5], [5, 12, 13], [6, 8, 10], [8, 15, 17], [7, 24, 25], [9, 12, 15]]), t = ri(0, 1);
    if (t === 0) { const k = pick([1, 2, 5, 10]); const a = tr[0] * k, b = tr[1] * k, c = tr[2] * k;
      return { q: `A cable is run diagonally across a rectangular compartment ${a} cm by ${b} cm. How long is the diagonal (the hypotenuse, c)?`, ans: c, unit: "cm", hint: "You want the longest side, so add the squares: c\xB2 = a\xB2 + b\xB2, then square root.", sol: `Label the sides: a = ${a} cm, b = ${b} cm, c = the diagonal (hypotenuse). Formula: c\xB2 = a\xB2 + b\xB2. Substitute: c\xB2 = ${a}\xB2 + ${b}\xB2 = ${a * a} + ${b * b} = ${a * a + b * b}. Square root: c = \u221A${a * a + b * b} = ${c} cm` }; }
    const k = pick([10, 20, 50, 100]); const a = tr[0] * k, b = tr[1] * k, c = tr[2] * k;
    return { q: `A diagonal brace is ${c} mm long (the hypotenuse, c) and spans ${a} mm horizontally (side a). How far does it reach vertically (side b)?`, ans: b, unit: "mm", hint: "You want a shorter side, so subtract: b\xB2 = c\xB2 \u2212 a\xB2, then square root.", sol: `Label the sides: c = ${c} mm (hypotenuse), a = ${a} mm, b = the vertical side. Start from c\xB2 = a\xB2 + b\xB2 and rearrange: b\xB2 = c\xB2 \u2212 a\xB2. Substitute: b\xB2 = ${c}\xB2 \u2212 ${a}\xB2 = ${c * c} \u2212 ${a * a} = ${c * c - a * a}. Square root: b = \u221A${c * c - a * a} = ${b} mm` };
  },
  graphs: () => {
    const m = ri(2, 9), c = ri(0, 40), x1 = ri(1, 5), x2 = x1 + ri(2, 6), t = ri(0, 1);
    if (t === 0) return { q: `A temperature-vs-time graph goes from (${x1} min, ${m * x1 + c} \xB0C) to (${x2} min, ${m * x2 + c} \xB0C). What is the gradient (\xB0C per min)?`, ans: m, unit: "\xB0C/min", hint: "Gradient = rise \xF7 run = (y2 \u2212 y1) \xF7 (x2 \u2212 x1).", sol: `Rise: ${m * x2 + c} \u2212 ${m * x1 + c} = ${m * (x2 - x1)}. Run: ${x2} \u2212 ${x1} = ${x2 - x1}. Gradient: ${m * (x2 - x1)} \xF7 ${x2 - x1} = ${m}` };
    const x = ri(2, 20);
    return { q: `A pump's head line is y = ${m}x + ${c}. What is y when x = ${x}?`, ans: m * x + c, unit: "", hint: "Substitute x into the equation.", sol: `Substitute x = ${x}: y = ${m} \xD7 ${x} + ${c}. Multiply first: ${m * x} + ${c}. Add: y = ${m * x + c}` };
  },
  averages: () => {
    const n = ri(4, 6), v = Array.from({ length: n }, () => ri(60, 95));
    const s = v.reduce((a, b) => a + b, 0);
    const t = ri(0, 1);
    if (t === 0) return { q: `Bearing temperatures (\xB0C) over ${n} rounds: ${v.join(", ")}. Find the mean (1 d.p.).`, ans: r(s / n, 1), unit: "\xB0C", hint: "Add them up and divide by how many there are.", sol: `Add: ${v.join(" + ")} = ${s}. Count: ${n} readings. Divide: ${s} \xF7 ${n} = ${r(s / n, 1)} \xB0C` };
    const o = [...v].sort((a, b) => a - b);
    return { q: `Bearing temperatures (\xB0C): ${v.join(", ")}. What is the range?`, ans: o[n - 1] - o[0], unit: "\xB0C", hint: "Range = highest \u2212 lowest.", sol: `Highest: ${o[n - 1]}. Lowest: ${o[0]}. Range: ${o[n - 1]} \u2212 ${o[0]} = ${o[n - 1] - o[0]} \xB0C` };
  },
  ma: () => {
    const t = ri(0, 1);
    if (t === 0) {
      const E = ri(5, 40) * 10, MA2 = ri(2, 8);
      return { q: `A chain block lifts a ${E * MA2} N load with an effort of ${E} N. What is the mechanical advantage?`, ans: MA2, unit: "", hint: "MA = load \xF7 effort.", sol: `Formula: MA = load \xF7 effort. Substitute: ${E * MA2} \xF7 ${E} = ${MA2} (no units)` };
    }
    const MA = ri(2, 6), VR = MA + ri(1, 4);
    return { q: `A lifting tackle has MA = ${MA} and velocity ratio VR = ${VR}. What is its efficiency in %? (1 d.p.)`, ans: r(MA / VR * 100, 1), unit: "%", hint: "Efficiency = MA \xF7 VR \xD7 100.", sol: `Formula: \u03B7 = MA \xF7 VR \xD7 100. Divide: ${MA} \xF7 ${VR} = ${r(MA / VR, 4)}. Times 100: ${r(MA / VR * 100, 1)}%` };
  },
  temp: () => {
    const t = ri(0, 2);
    if (t === 0) {
      const C2 = ri(-10, 120);
      return { q: `Convert ${C2} \xB0C to kelvin.`, ans: C2 + 273, unit: "K", hint: "K = \xB0C + 273.", sol: `Formula: K = \xB0C + 273. Substitute: ${C2} + 273 = ${C2 + 273} K` };
    }
    if (t === 1) {
      const C2 = ri(0, 40) * 5;
      return { q: `An exhaust thermometer reads ${C2} \xB0C. Convert to \xB0F.`, ans: r(C2 * 9 / 5 + 32, 1), unit: "\xB0F", hint: "\xB0F = \xB0C \xD7 9/5 + 32.", sol: `Formula: \xB0F = \xB0C \xD7 1.8 + 32. Multiply: ${C2} \xD7 1.8 = ${r(C2 * 1.8, 1)}. Add 32: ${r(C2 * 9 / 5 + 32, 1)} \xB0F` };
    }
    const F = ri(40, 250);
    const C = r((F - 32) * 5 / 9, 1);
    return { q: `Convert ${F} \xB0F to \xB0C (1 d.p.).`, ans: C, unit: "\xB0C", hint: "\xB0C = (\xB0F \u2212 32) \xD7 5/9.", sol: `Formula: \xB0C = (\xB0F \u2212 32) \xD7 5 \xF7 9. Subtract 32 first: ${F} \u2212 32 = ${F - 32}. Times 5 \xF7 9: ${F - 32} \xD7 5 \xF7 9 = ${C} \xB0C` };
  },
  flow: () => {
    const t = ri(0, 1);
    if (t === 0) {
      const V = ri(5, 60), Q2 = pick([5, 10, 15, 20, 25, 30]);
      return { q: `A ballast pump moves ${Q2} m\xB3/h. How many minutes to empty a ${V * Q2 / 10} m\xB3 tank?`, ans: r(V * 6, 2), unit: "min", hint: "Time = volume \xF7 flow rate (gives hours), then \xD7 60.", sol: `Formula: t = V \xF7 Q. Substitute: ${V * Q2 / 10} \xF7 ${Q2} = ${V / 10} h. Convert to minutes: ${V / 10} \xD7 60 = ${r(V * 6, 2)} min` };
    }
    const d = pick([0.05, 0.1, 0.15, 0.2]), vel = ri(1, 4);
    const Q = Math.PI * (d / 2) ** 2 * vel;
    return { q: `Seawater flows at ${vel} m/s through a pipe of bore ${d} m. Find the flow rate in m\xB3/s (4 d.p.).`, ans: r(Q, 4), unit: "m\xB3/s", hint: "Q = A \xD7 v, with A = \u03C0 d\xB2 \xF7 4.", sol: `Area: A = \u03C0 \xD7 ${d}\xB2 \xF7 4 = ${r(Math.PI * d * d / 4, 5)} m\xB2. Formula: Q = A \xD7 v. Multiply: ${r(Math.PI * d * d / 4, 5)} \xD7 ${vel} = ${r(Q, 4)} m\xB3/s`, tol: 0.01 };
  }
};

const L = {
